name: Update download stats

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count GitHub release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOTAL=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '[.[].assets[].download_count] | add // 0')
          echo "Total release downloads: ${TOTAL}"

          mkdir -p .github/stats
          jq -n --argjson t "$TOTAL" \
            '{schemaVersion: 1, label: "downloads", message: ($t | tostring), color: "brightgreen"}' \
            > .github/stats/downloads.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/stats/downloads.json
          git diff --cached --quiet || git commit -m "chore(stats): update download count [skip ci]"
          git push
