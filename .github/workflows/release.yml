name: Release

# Dispara ao criar/pushar uma tag v* (ex.: v0.1.0)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci

      - name: Build & bundle (assinado)
        uses: tauri-apps/tauri-action@v0
        env:
          # Chave privada de assinatura do updater, guardada como secret.
          # Sem isso, o artefato .sig não é gerado e o app não consegue
          # validar atualizações. Ver README: "Publicando uma release".
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: KumaDrive ${{ github.ref_name }}
          releaseBody: |
            ## KumaDrive ${{ github.ref_name }}

            Instalador para Windows.

            - **NSIS** (recomendado — suporta atualização automática): `*-setup.exe`
            - **MSI**: `*.msi`

            O app verifica atualizações em Configurações → Sobre → Verificar atualizações.
          releaseDraft: true
          prerelease: false

      - name: Resume
        shell: bash
        run: |
          echo "### Release ${{ github.ref_name }} publicada"
          echo ""
          echo "Artefatos (incluindo latest.json e .sig) foram anexados automaticamente"
          echo "pela tauri-action. O arquivo latest.json e o que o app consulta."
          echo ""
          echo "1. Va em https://github.com/${{ github.repository }}/releases"
          echo "2. Edite o rascunho e publique (draft: true)"
          echo "3. Teste: /verificar-atualizacoes no app"