name: Release

# Dispara ao criar/pushar uma tag v* (ex.: v0.1.0)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci

      # Extrai a seção DESTA versão do CHANGELOG.md para usar como corpo da
      # release. Isso é o que o app lê em `update.body` e mostra na tela de
      # atualização ("Novidades desta versão"). Antes o releaseBody era fixo
      # (instruções de instalação), então a tela nunca mostrava o que mudou.
      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Extraindo CHANGELOG para v${VERSION}"
          # Pega do cabeçalho '## [VERSION]' até o próximo '## [' (exclusive).
          # `|| true`: se o awk falhar (arquivo ausente), o `set -e` abortaria
          # o step inteiro ANTES do fallback abaixo — e, como este step
          # precede o tauri-action, a release toda falharia. Com `|| true`,
          # o fallback roda.
          NOTES="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md || true)"
          if [ -z "$NOTES" ]; then
            echo "AVISO: nenhuma seção [${VERSION}] encontrada no CHANGELOG; usando fallback."
            NOTES="Veja o CHANGELOG.md do projeto para os detalhes desta versão."
          fi
          {
            echo "releaseBody<<EOF_CHANGELOG"
            echo "## KumaDrive v${VERSION}"
            echo ""
            echo "### Novidades desta versão"
            echo ""
            echo "$NOTES"
            echo ""
            echo "---"
            echo ""
            echo "**Instaladores para Windows**"
            echo "- **NSIS** (recomendado — suporta atualização automática): \`*-setup.exe\`"
            echo "- **MSI**: \`*.msi\`"
            echo "EOF_CHANGELOG"
          } >> "$GITHUB_OUTPUT"

      - name: Build & bundle (assinado)
        uses: tauri-apps/tauri-action@v0
        env:
          # Chave privada de assinatura do updater, guardada como secret.
          # Sem isso, o artefato .sig não é gerado e o app não consegue
          # validar atualizações. Ver README: "Publicando uma release".
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: KumaDrive ${{ github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.releaseBody }}
          releaseDraft: false
          prerelease: false

      - name: Resume
        shell: bash
        run: |
          echo "### Release ${{ github.ref_name }} publicada"
          echo ""
          echo "Artefatos (incluindo latest.json e .sig) foram anexados automaticamente"
          echo "pela tauri-action. O arquivo latest.json e o que o app consulta."
          echo ""
          echo "Release publicada automaticamente (releaseDraft: false)."
          echo ""
          echo "Teste no app: Configurações -> Sobre -> Verificar atualizações."